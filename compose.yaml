# VibeChat 的开发环境。在仓库的根目录执行：
#
#   docker compose up -d                       启动开发容器
#   docker compose exec dev ./scripts/dev      在里面同时启动后端和前端，浏览器打开 http://127.0.0.1:8780
#   docker compose --profile calls up -d       另外启动通话要用的中转服务（coturn）和媒体转发服务（LiveKit）
#   ./scripts/test-all                         全量测试（会临时启动 profile test 里的几个容器）
#
# 端口、通话的地址可以在仓库根目录的 .env（不进 git）里改，见 README。
# 这台机器特有的设置（例如再多绑一个地址）写在 compose.override.yaml 里（不进 git），compose 会自动读它。

name: vibechat

services:
  dev:
    build:
      context: dev
      dockerfile: Dockerfile
    image: vibechat-dev
    container_name: vibechat
    hostname: vibechat
    restart: unless-stopped
    init: true
    user: ubuntu
    working_dir: /vibechat
    volumes:
      # 整个仓库挂进去；编译产物和容器的 home（cargo 的下载缓存在里面）放命名卷，不走宿主机的文件共享
      - ./:/vibechat
      - cargo_target:/vibechat/server/target
      - home:/home/ubuntu
    environment:
      # 用户在浏览器里访问的地址；服务端用它校验请求的来源。请用 127.0.0.1 打开，不要用 localhost
      - PUBLIC_URL=http://127.0.0.1:${VC_WEB_PORT:-8780}
      - DATABASE_URL=sqlite:///vibechat/data/db/vibechat.db?mode=rwc
      - FILES_DIR=/vibechat/data/files
      # 数据库里还没有管理员时，用这两项创建第一名管理员（ID 是 admin），第一次登录后必须改密码
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_INITIAL_PASSWORD=change-me-1
      # 一对一通话的中转服务（profile calls 里的 turn）。浏览器要连得到这个地址：
      # 浏览器连不上 127.0.0.1 时（例如从别的电脑、手机上试），把 VC_HOST_IP 设成这台机器在局域网里的地址
      - TURN_URLS=turn:${VC_HOST_IP:-127.0.0.1}:3578?transport=udp,turn:${VC_HOST_IP:-127.0.0.1}:3578?transport=tcp
      - TURN_SECRET=local-dev-turn-secret
      # 群通话的媒体转发服务（profile calls 里的 livekit）：服务端和前端的开发服务器都连它控制用的端口
      - LIVEKIT_URL=http://127.0.0.1:7980
      - LIVEKIT_API_KEY=vibechat-dev
      - LIVEKIT_API_SECRET=local-dev-livekit-secret-0123456789abcdef
    ports:
      - '${VC_BIND:-127.0.0.1}:${VC_WEB_PORT:-8780}:3480' # 网页（Vite，/api、/ws、/livekit 转给后面的服务）
      - '${VC_BIND:-127.0.0.1}:${VC_API_PORT:-8788}:3488' # 服务端
      # 通话：中转服务，以及群通话的声音和画面。这几个端口号宿主机和容器里必须一样
      - '${VC_BIND:-127.0.0.1}:3578:3578/udp'
      - '${VC_BIND:-127.0.0.1}:3578:3578/tcp'
      - '${VC_BIND:-127.0.0.1}:7981:7981/tcp'
      - '${VC_BIND:-127.0.0.1}:7982:7982/udp'

  # ---- 手工试通话时启动（profile calls），平时不运行 ----

  turn:
    image: coturn/coturn:4.18.0-alpine
    profiles: ['calls']
    network_mode: 'service:dev'
    volumes:
      - ./dev/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # 不用镜像默认的参数（它会去外部网站查公网地址），只读配置文件，中转绑在容器自己的地址上
    entrypoint: ['sh', '-c', 'exec turnserver -c /etc/coturn/turnserver.conf --relay-ip="$$(hostname -i | cut -d" " -f1)"']

  livekit:
    image: livekit/livekit-server:v1.13.11
    profiles: ['calls']
    network_mode: 'service:dev'
    # 只给必要的权限：不用 root，不要任何特权，文件系统只读
    user: '65534:65534'
    cap_drop: ['ALL']
    read_only: true
    volumes:
      - ./dev/livekit/livekit.yaml:/etc/livekit.yaml:ro
    command: ['--config', '/etc/livekit.yaml', '--node-ip', '${VC_HOST_IP:-127.0.0.1}']

  # ---- 跑测试时启动（profile test），由 scripts/test-all 管 ----

  # 测试用的 PostgreSQL：数据放在内存里，每次都是干净的库
  pg-test:
    image: postgres:16
    profiles: ['test']
    environment:
      - POSTGRES_PASSWORD=test
    tmpfs:
      - /var/lib/postgresql/data

  turn-test:
    image: coturn/coturn:4.18.0-alpine
    profiles: ['test']
    network_mode: 'service:dev'
    volumes:
      - ./dev/coturn/turnserver-test.conf:/etc/coturn/turnserver.conf:ro
    command: ['-c', '/etc/coturn/turnserver.conf']

  livekit-test:
    image: livekit/livekit-server:v1.13.11
    profiles: ['test']
    network_mode: 'service:dev'
    user: '65534:65534'
    cap_drop: ['ALL']
    read_only: true
    volumes:
      - ./dev/livekit/livekit-test.yaml:/etc/livekit.yaml:ro
    command: ['--config', '/etc/livekit.yaml']

  # 端到端测试：Playwright 驱动 Chrome、Safari 两种浏览器内核。
  # 和开发容器共用网络：测试里访问 http://127.0.0.1:3490，浏览器把它当作安全的地址，麦克风等才能用
  e2e:
    build:
      context: dev
      dockerfile: Dockerfile.e2e
    image: vibechat-e2e
    profiles: ['test']
    init: true
    network_mode: 'service:dev'
    # Chrome 要较大的共享内存
    shm_size: 1gb
    volumes:
      - ./client:/vibechat/client
      # pnpm 用开发容器里已经下好的那一份（在它的 home 卷里），不用每次都联网下载
      - type: volume
        source: home
        target: /corepack
        read_only: true
        volume:
          subpath: .cache/node/corepack
    environment:
      - COREPACK_HOME=/corepack

volumes:
  cargo_target:
  home:
