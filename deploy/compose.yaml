# 在一台服务器上部署 VibeChat。说明见 docs/deploy.md（中文）、docs/deploy.en.md（English）。
#
# 在 deploy 目录下执行：
#   cp env.example .env                               照着说明填好 .env
#   docker compose up -d --build                      网页入口和服务端（能聊天）
#   docker compose --profile calls up -d --build      另外启动通话用的 coturn 和 LiveKit（要有域名和 HTTPS）
#
# Deploy VibeChat on one server. See docs/deploy.en.md. Run in this directory:
#   cp env.example .env; docker compose up -d --build            (chat)
#   docker compose --profile calls up -d --build                  (plus voice/video calls; needs a domain and HTTPS)

name: vibechat-deploy

services:
  # 服务端
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    image: vibechat-server
    restart: unless-stopped
    environment:
      # 用户在浏览器里打开的地址，例如 https://chat.example.com 或 http://203.0.113.10
      PUBLIC_URL: ${PUBLIC_URL:?在 .env 里填写 PUBLIC_URL}
      # 数据库里还没有管理员时，用这两项创建第一名管理员（ID 是 admin），第一次登录后必须改密码
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      # 默认是 SQLite（在数据卷里）。用 PostgreSQL 时见 .env 里的说明
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/db/vibechat.db?mode=rwc}
      # 请求都经过网页入口转过来：只采信它带来的"用户的真实地址"，按地址限速时才不会把所有人当成一个人
      TRUSTED_PROXIES: 172.31.250.10
      # 发信服务（找回管理员密码、确认邮箱用）。不填时邮件写在数据卷的 mail 目录里
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # 通话：只在启动了 calls 这一组、并且 .env 里填了密钥时生效；空着就是没有通话功能
      TURN_URLS: ${TURN_SECRET:+turn:${PUBLIC_IP}:3478?transport=udp,turn:${PUBLIC_IP}:3478?transport=tcp}
      TURN_SECRET: ${TURN_SECRET:-}
      LIVEKIT_URL: ${LIVEKIT_API_SECRET:+http://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_SECRET:+vibechat}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - data:/data
    networks:
      vibechat:
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # 网页和对外的唯一入口（Caddy）：HTTPS、页面、把请求转给服务端和 LiveKit
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    image: vibechat-web
    restart: unless-stopped
    environment:
      # 域名（自动申请 HTTPS 证书），或者只有 IP 时写 :80
      SITE: ${SITE:?在 .env 里填写 SITE}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      # 证书存在这里，重建容器也不用重新申请
      - caddy_data:/data
      - caddy_config:/config
    networks:
      vibechat:
        ipv4_address: 172.31.250.10
    depends_on:
      - app

  # ---- 通话（profile calls）：要有域名和 HTTPS，浏览器才让网页用麦克风和摄像头 ----
  # 启动前要在 .env 里填好 PUBLIC_IP、TURN_SECRET、LIVEKIT_API_SECRET

  # 一对一通话的中转服务。用宿主机的网络：一百个中转端口经过 Docker 转发既慢又占资源
  turn:
    image: coturn/coturn:4.18.0-alpine
    profiles: ['calls']
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      PUBLIC_IP: ${PUBLIC_IP:-}
      PRIVATE_IP: ${PRIVATE_IP:-}
      REALM: ${SITE}
    # 机器上直接有公网地址时只告诉浏览器公网地址；云服务器上只有内网地址、公网地址由外面映射进来时，
    # 在内网地址上收发、告诉浏览器公网地址，并且放行本机的内网地址（两边都走中转时，声音从一个中转端口发到另一个）
    entrypoint:
      - sh
      - -c
      - |
        set -- -c /etc/coturn/turnserver.conf --static-auth-secret="$$TURN_SECRET" --realm="$$REALM"
        if [ -n "$$PRIVATE_IP" ]; then
          set -- "$$@" --listening-ip="$$PRIVATE_IP" --relay-ip="$$PRIVATE_IP" \
            --external-ip="$$PUBLIC_IP/$$PRIVATE_IP" --allowed-peer-ip="$$PRIVATE_IP"
        else
          set -- "$$@" --external-ip="$$PUBLIC_IP"
        fi
        exec turnserver "$$@"

  # 群通话的媒体转发服务。控制用的端口 7880 只在内部网络里；声音和画面走 7881、7882
  livekit:
    image: livekit/livekit-server:v1.13.11
    profiles: ['calls']
    restart: unless-stopped
    # 只给必要的权限：不用 root，不要任何特权，文件系统只读
    user: '65534:65534'
    cap_drop: ['ALL']
    read_only: true
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: 'vibechat: ${LIVEKIT_API_SECRET:-}'
    command: ['--config', '/etc/livekit.yaml', '--node-ip', '${PUBLIC_IP:-}']
    ports:
      - '7881:7881/tcp'
      - '7882:7882/udp'
    networks:
      vibechat:

  # ---- PostgreSQL（profile postgres，可选）：默认用 SQLite 就够了 ----
  postgres:
    image: postgres:16
    profiles: ['postgres']
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibechat
      POSTGRES_DB: vibechat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'vibechat']
      interval: 5s
      retries: 20
    networks:
      vibechat:

volumes:
  data:
  caddy_data:
  caddy_config:
  postgres:

networks:
  # 地址固定，服务端才能认出网页入口（TRUSTED_PROXIES）。和机器上已有的网络冲突时，
  # 这里的网段和上面的两个地址一起改
  vibechat:
    ipam:
      config:
        - subnet: 172.31.250.0/24
