# 一对一通话的中转服务（coturn）。只在启动了 calls 这一组时运行，说明见 docs/deploy.md。
# 密钥、对外的地址这些因机器而异的，由 compose.yaml 用启动参数给，不写在这里。
#
# One-to-one call relay. The secret and addresses are passed on the command line by compose.yaml.

listening-port=3478
# 中转用的端口范围：每一路通话占一两个。要在防火墙上放开（UDP）
min-port=49160
max-port=49260

# 只认服务端签发的临时账号（共享密钥由启动参数 --static-auth-secret 给）
use-auth-secret

# 只做中转：不许转发到内网、本机和保留的地址，防止被人当跳板访问服务器所在的内网
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
no-multicast-peers

# 一个账号最多同时占几个中转（一个人开几个窗口），总共最多几个
user-quota=12
total-quota=200

# 只用普通的 turn:（声音本身已经端到端加密），不开 TLS，不需要证书
no-tls
no-dtls
fingerprint
log-file=stdout
pidfile=/tmp/turnserver.pid
