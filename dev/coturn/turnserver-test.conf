# 跑自动化测试时用的中转服务（coturn），由 scripts/test-all 启动。
# 测试里的浏览器和它在同一个网络里，所以监听和中转都绑在 127.0.0.1 上；端口和手工用的错开。
# 和 scripts/e2e-stack 里的 TURN_URLS、TURN_SECRET 对应
listening-ip=127.0.0.1
relay-ip=127.0.0.1
listening-port=3479
# 每个浏览器窗口对每个中转地址（UDP、TCP 各一个）都要占一个端口，几个浏览器内核的测试同时跑，要留够
min-port=49200
max-port=49399

use-auth-secret
static-auth-secret=e2e-turn-secret
realm=vibechat.test

allow-loopback-peers
no-multicast-peers
no-tls
fingerprint
log-file=stdout
pidfile=/tmp/turnserver.pid
