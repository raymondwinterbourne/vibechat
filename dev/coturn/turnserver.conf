# 手工试通话时用的中转服务（coturn）。docker compose --profile calls up -d 时启动。
# 和开发容器共用网络。浏览器连的地址是 compose 里 TURN_URLS 写的那个（默认 127.0.0.1:3578）。
listening-port=3578
min-port=49160
max-port=49359

# 只认服务端签发的临时账号，密钥和 compose.yaml 里的 TURN_SECRET 一样。只在本机开发用
use-auth-secret
static-auth-secret=local-dev-turn-secret
realm=vibechat.local

no-multicast-peers
no-tls
fingerprint
log-file=stdout
pidfile=/tmp/turnserver.pid
